<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Cours et quiz de révision pour le titre professionnel Concepteur Développeur d'Applications : conception, développement, déploiement et sécurité."
    />
    <meta name="color-scheme" content="light dark" />
    <title>Révision CDA — Concepteur Développeur d'Applications</title>
    <script>
      // Appliqué avant le premier rendu pour éviter un éclair de thème clair.
      try {
        var mode = localStorage.getItem('revision-cda-theme');
        var sombre =
          mode === 'sombre' ||
          (mode !== 'clair' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (sombre) document.documentElement.classList.add('dark');
      } catch (e) {
        /* stockage indisponible : on garde le thème clair */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
