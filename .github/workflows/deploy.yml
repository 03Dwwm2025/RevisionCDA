name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: deploy
          key: ${{ secrets.SSH_KEY }}
          envs: TOKEN,IMAGE,ACTOR
          script: |
            echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
            docker pull "$IMAGE"
            docker stop revision-cda 2>/dev/null || true
            docker rm   revision-cda 2>/dev/null || true
            docker run -d \
              --name revision-cda \
              --restart unless-stopped \
              -p 8080:80 \
              "$IMAGE"
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}:latest
          ACTOR: ${{ github.actor }}
